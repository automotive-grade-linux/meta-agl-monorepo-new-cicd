header:
  version: 22

# Optional, local-developer only - only included when $AGL_SSTATE_DIR is set (see
# ci/scripts/_kas_runtime_args.sh). Never wired into any ci/build-matrix.yaml combo or CI
# workflow directly.
env:
  AGL_SSTATE_DIR:

local_conf_header:
  sstate-shared: |
    SSTATE_DIR = "${AGL_SSTATE_DIR}"
