# SPDX-License-Identifier: MIT
# One entry per bitbake target ("image"), with the list of machines it's curated to build on.
# Schema (see ci/scripts/_matrix.py for the loader/expander every consumer shares):
#
#   machine_eula: {<machine>: true}
#     Machines needing EULA_<MACHINE>=1 acceptance to build AT ALL (proprietary/license-gated
#     BSP bits) - a pure property of the machine, same for every image, so it's listed once
#     here instead of repeated per image.
#
#   images:
#     - target: <bitbake target>
#       features: [<aglsetup-style feature name>, ...]
#         No conflict-checking happens automatically (aglsetup.sh itself never did this either -
#         purely additive). Known mutually-incompatible feature pairs (e.g. agl-kvm + agl-xen -
#         two hypervisor backends can't coexist on one image) are enforced separately by
#         INCOMPATIBLE_FEATURES in ci/scripts/_matrix.py, checked by `make validate` and CI.
#       sdk: bool
#       tiers: [...]          <- DEFAULT tiers for every machine below, unless overridden
#       machines:
#         - <machine name>                          <- uses the image's default tiers above
#         - <machine name>: {tiers: [<override>]}   <- per-machine tier override
#
# tiers: which trigger types build this entry.
#   push-pr  -> push, PR/MR (fast feedback subset)
#   nightly  -> nightly schedule
#   release  -> tag/release builds
#   dispatch -> always available via manual workflow_dispatch
#   []       -> never built by CI (still buildable locally via `make build MACHINE=...`).
#
# No `combo:` field: ci/scripts/_compose_kasfiles.py computes the colon-joined kas file list
# directly from machine+features (ci/kas/base.yml:ci/kas/machine/<m>.yml:ci/kas/feature/<f>.yml:
# ...:ci/kas/pins.yml). External-repo commit pins live in one consolidated ci/kas/pins.yml,
# always appended last - no per-combination lockfile. See docs/setup.md.
#
# agl-devel (passwordless login for HIL testing) and AGL's agl-ci tuning are NOT a `features:`
# entry - every CI build gets them automatically via ci/kas/ci-only.yml (see setup.sh). A local
# developer who wants agl-devel adds it themselves: `make build ... EXTRA_FEATURES=agl-devel`.
#
# Per-machine demo-image curation (decision #17, resolved): see WIP.md "round 8" for the full
# image -> features -> machines table and its provenance.

