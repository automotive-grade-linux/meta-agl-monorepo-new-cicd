# generic-arm64 deliberately excluded: its MACHINE has no conf/machine/generic-arm64.conf
# anywhere in AGL's manifest-pinned meta-arm (wrynose branch) - "require
# conf/distro/include/INVALID-tune.inc" fails identically under aglsetup.sh, this is a
# pre-existing upstream gap discovered during kas validation, not a migration bug. See
# WIP.md "Implementation status" for detail. ci/kas/machine/generic-arm64.yml exists but
# is not wired into this file.

# `make validate`'s yocto-check-layer sub-check (see ci/scripts/_matrix.py's
# load_check_layers() and ci/scripts/validate.sh). Defaults to checking just
# meta-agl/meta-agl-core (CHECK_LAYERS in the Makefile); `make validate
# CHECK_LAYERS=all` checks every layer listed here.
check_layers:
  # Recursively scanned for conf/layer.conf files so yocto-check-layer's --dependency flag can
  # auto-resolve each checked layer's declared LAYERDEPENDS_<name> - shared across every layer
  # below, not per-layer (most AGL sublayers declare LAYERDEPENDS correctly and need nothing
  # more than this to check cleanly).
  dependency_roots:
    - meta-agl
    - meta-agl-demo
    - meta-agl-devel
    - external/openembedded-core
    - external/meta-openembedded
    - external/meta-qt6
    - external/meta-flutter
    - external/meta-virtualization

  # Same list-item shape as images:/machines: above - a bare path relies on LAYERDEPENDS-based
  # auto-resolution (via dependency_roots) alone; a {path: {additional_layers: [...]}} entry
  # force-adds layers for the few that declare no LAYERDEPENDS at all despite clearly needing
  # other layers (confirmed by reading their conf/layer.conf: zero LAYERDEPENDS_<name>, despite
  # dozens of .bbappend files targeting recipes elsewhere). For those,
  # `additional_layers: [meta-agl/meta-agl-core]` is a best-effort guess, not a verified
  # fact - nothing anywhere declares what they actually need. Adjust here (not in code) if
  # `make validate CHECK_LAYERS=all` still errors on one of them for a genuinely missing layer.
  layers:
    - meta-agl/meta-agl-core
    - meta-agl/meta-agl-bsp: {additional_layers: [meta-agl/meta-agl-core]}
    - meta-agl/meta-pipewire
    - meta-agl/meta-app-framework
    - meta-agl/meta-agl-kuksa-val
    - meta-agl/meta-agl-flutter
    - meta-agl/meta-agl-ic
    - meta-agl/meta-agl-drm-lease
    - meta-agl/meta-netboot
    - meta-agl-demo
    - meta-agl-demo/meta-agl-demo-shared
    - meta-agl-demo/meta-agl-kvm-demo
    - meta-agl-devel/meta-agl-ic-container
    - meta-agl-devel/meta-agl-xen
    - meta-agl-devel/meta-uhmi: {additional_layers: [meta-agl/meta-agl-core]}
    - meta-agl-devel/meta-agl-rdp: {additional_layers: [meta-agl/meta-agl-core]}
    - meta-agl-devel/meta-agl-ros2: {additional_layers: [meta-agl/meta-agl-core]}
    - meta-agl-devel/meta-agl-test: {additional_layers: [meta-agl/meta-agl-core]}
    - meta-agl-devel/meta-offline-voice-agent
    - meta-agl-devel/meta-virtio
