# Configuration fragments (conf/fragments/agl/*.conf) used by bitbake-setup. Generated from
# kas/*.yml by ci/scripts/_compose_setup.py --write-fragments - this layer has no recipes.
# No BBPATH entry on purpose: fragments are found via the layer directory, and a BBPATH
# entry would put this (otherwise empty) layer into every classes/conf/files search path.

BBFILE_COLLECTIONS += "agl-setup"
BBFILE_PATTERN_agl-setup = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_agl-setup = "1"
BBFILE_PRIORITY_agl-setup = "1"

LAYERSERIES_COMPAT_agl-setup = "wrynose"
